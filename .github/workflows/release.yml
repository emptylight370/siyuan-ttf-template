name: Create Release on Push Package.json

on:
  push:
    paths:
      - plugin.json
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        uses: emptylight370/jq-action@v1
        id: version
        with:
          data: plugin.json
          filter: .version

      - name: Skip if release exists
        uses: mukunku/release-exists-action@v1.1.0
        id: compare
        with:
          tag: ${{ steps.version.outputs.result }}

      - name: Setup mise
        if: steps.compare.outputs.exists != 'true'
        uses: jdx/mise-action@v5

      - name: Package
        if: steps.compare.outputs.exists != 'true'
        run: zip -r package.zip . -i 'index.*' 'icon.png' 'preview.png' 'plugin.json' 'README*.md' 'fonts/*'

      - name: Generate release description
        if: steps.compare.outputs.exists != 'true'
        run: |
          git cliff -u -o release.md -t ${{ steps.version.outputs.result }}
          prettier -w release.md

      - name: Release
        if: steps.compare.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: package.zip
          name: Release ${{ steps.version.outputs.result }}
          tag_name: ${{ steps.version.outputs.result }}
          make_latest: true
          body_path: release.md
